resources:
  - ../../../base/node-pool
patches:
  - options:
      allowNameChange: true
    patch: |-
      - op: replace
        path: /metadata/name
        value: broker-node-pool
      - op: replace
        path: /spec/roles
        value:
          - broker
    target:
      kind: KafkaNodePool
      name: node-pool
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
