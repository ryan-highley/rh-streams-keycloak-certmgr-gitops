apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# resources:
#   - ../../base
components:
  - ../../components/dex
patches:
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: kafka-console
    target:
      group: console.streamshub.github.com
      kind: Console
      version: v1alpha1
  - patch: |-
      - op: replace
        path: /metadata/namespace
        value: kafka-console
    target:
      kind: Secret
      name: kafka-console-client-secret
