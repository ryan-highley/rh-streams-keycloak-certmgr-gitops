apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - Console_kafka-console.yaml

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: kafka-console-client-secret
    behavior: create
    type: Opaque
    literals:
      - clientSecret=shhh-kafka-console
