apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# resources:
#   - ../../base

components:
  - ../../components/dex

patches:
  - target:
      kind: Console
      group: console.streamshub.github.com
      version: v1alpha1
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: kafka-console
  - target:
      kind: Secret
      name: kafka-console-client-secret
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: kafka-console
