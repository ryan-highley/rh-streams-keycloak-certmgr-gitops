resources:
  - ../../base
patches:
  - patch: |-
      - op: replace
        path: /spec/source/path
        value: argocd/cluster-config/profiles/cert-manager-custom-ca
    target:
      kind: Application
      name: cluster-config
transformers:
  - transformers/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
