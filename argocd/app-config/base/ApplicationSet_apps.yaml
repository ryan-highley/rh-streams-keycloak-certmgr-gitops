apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: amq-broker
            namespace: '*'
            path: app-config/apps/amq-broker/overlays/default
          - name: rh-streams-kafka
            namespace: '*'
            path: app-config/apps/rh-streams-kafka/overlays/default
  template:
    metadata:
      name: 'cluster-apps-{{.name}}'
    spec:
      project: cluster-config
      source:
        path: '{{.path}}'
        repoURL: https://github.com/ryan-highley/rh-streams-keycloak-certmgr-gitops
      destination:
        namespace: '{{.namespace}}'
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
