apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - name: cert-manager
            namespace: cert-manager
            path: cluster-config/cluster-apps/openshift-cert-manager/overlays/default
          - name: keycloak
            namespace: keycloak
            path: cluster-config/cluster-apps/rh-keycloak/overlays/default
  template:
    metadata:
      name: 'cluster-apps-{{.name}}'
    spec:
      project: cluster-config
      source:
        path: '{{.path}}'
        repoURL: https://github.com/ryan-highley/rh-streams-keycloak-certmgr-gitops
      destination:
        namespace: '{{.namespace}}'
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
