        topics:
          - name: actors
            spec:
              replicas: 3
              partitions: 12
          - name: directors
            spec:
              replicas: 3
              partitions: 6
          - name: movies
            spec:
              replicas: 3
              partitions: 6
          - name: producers
            spec:
              replicas: 3
              partitions: 12
          - name: stunts
            spec:
              replicas: 3
              partitions: 24

        users:
          - name: kafka-console
            spec:
              authentication:
                type: scram-sha-512

        clientApp:
          namespace: movies-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
